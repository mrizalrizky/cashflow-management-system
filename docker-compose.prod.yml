# Produksi. Dijalankan dengan berkas env yang tidak ada di repositori:
#
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build
#
# Tidak ada port yang dibuka: satu-satunya jalan masuk adalah Cloudflare Tunnel (`cloudflared`),
# yang meneruskan ke `web`. Database berada di luar (Neon), lewat DATABASE_URL.
# Panduan lengkap: docs/deployment.md
name: cashflow

x-long-running: &long-running
  restart: unless-stopped
  # Log dibatasi supaya tidak memenuhi disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-backup-image: &backup-image
  build:
    context: .
    dockerfile: deploy/backup.Dockerfile
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di berkas env}
    STORAGE_DIR: /data/storage
    BACKUP_DIR: /backups
    BACKUP_AT: ${BACKUP_AT:-01:30}
    BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    TZ: ${TZ:-Asia/Jakarta}
  networks: [app]

services:
  # Sekali jalan tiap deploy: menerapkan migrasi yang belum ada, lalu seed (aman diulang).
  migrate:
    build:
      <<: *api-build
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di berkas env}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL wajib diisi di berkas env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD wajib diisi di berkas env}
    restart: "no"
    networks: [app]

  api:
    <<: *long-running
    build:
      <<: *api-build
      target: runtime
    environment:
      # Ditetapkan di sini, bukan di berkas env: tanpa `production`, dokumentasi API terbuka
      # dan cookie sesi tidak ditandai Secure.
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di berkas env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi di berkas env}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      # Dua proxy di depan API: Cloudflare (lewat tunnel), lalu Caddy. Dengan angka ini batas
      # percobaan login menghitung alamat pengunjung, bukan alamat proxy.
      TRUST_PROXY_HOPS: "2"
      STORAGE_DIR: /data/storage
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - storage:/data/storage
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Caddy: menyajikan web dan meneruskan /api ke `api`. HTTP biasa, hanya di jaringan Docker.
  web:
    <<: *long-running
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks: [edge, app]
    depends_on:
      api:
        condition: service_healthy

  # Sambungan keluar ke Cloudflare. Di dasbor Cloudflare, hostname publik tunnel ini
  # diarahkan ke http://web:8080.
  cloudflared:
    <<: *long-running
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN wajib diisi di berkas env}
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy

  # Cadangan tiap malam: database dan berkas bukti dalam satu folder (docs/backup-restore.md).
  backup:
    <<: [*long-running, *backup-image]
    volumes:
      - storage:/data/storage:ro
      - ${BACKUP_HOST_DIR:?BACKUP_HOST_DIR wajib diisi di berkas env}:/backups

  # Hanya dijalankan dengan sengaja:
  #   docker compose ... --profile tools run --rm restore /backups/<nama cadangan> [--force]
  restore:
    <<: *backup-image
    profiles: ["tools"]
    entrypoint: ["bash", "scripts/restore.sh"]
    volumes:
      - storage:/data/storage
      - ${BACKUP_HOST_DIR:?BACKUP_HOST_DIR wajib diisi di berkas env}:/backups:ro
    restart: "no"

networks:
  # Hanya tunnel dan Caddy. Tunnel tidak berada di jaringan `app`, jadi salah mengisi alamat di
  # dasbor Cloudflare pun tidak bisa membuat API terjangkau tanpa lewat Caddy.
  edge:
  app:

volumes:
  # Berkas bukti transaksi.
  storage:
